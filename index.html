<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Slot Data</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 12px;
    }

    h1 {
      font-size: 22px;
    }

    select {
      font-size: 16px;
      padding: 6px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 16px;
    }

    table {
      border-collapse: collapse;
      min-width: 800px;
      font-size: 14px;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 6px 8px;
      white-space: nowrap;
      text-align: center;
    }
  </style>
</head>

<body>

  <h1>スロットデータ</h1>

  <label>
    店舗：
    <select id="shop-select">
      <option value="">全店舗</option>
    </select>
  </label>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>店舗</th>
          <th>台番</th>
          <th>BIG</th>
          <th>REG</th>
          <th>回転数</th>
          <th>日付</th>
          <th>機種</th>
          <th>差枚</th>
          <th>RANK</th>
        </tr>
      </thead>

      <tbody id="slot-data"></tbody>
    </table>
  </div>

  <script>
    const SUPABASE_URL =
      'https://cbakwimqxhfbqdnvyeoi.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_CIVy_I-SIKBrfNfXa1sGYQ_b3sMvKMm';


    async function loadShops() {

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/slot?select=shopid&order=shopid`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      const data = await response.json();

      const shops = [
        ...new Set(
          data.map(row => row.shopid)
        )
      ];

      const select =
        document.getElementById('shop-select');

      shops.forEach(shop => {

        const option =
          document.createElement('option');

        option.value = shop;
        option.textContent = shop;

        select.appendChild(option);
      });


      // URLに ?shop= がある場合
      const params =
        new URLSearchParams(location.search);

      const shop =
        params.get('shop');

      if (shop) {
        select.value = shop;
      }
    }


    async function loadData() {

      const shop =
        document.getElementById('shop-select').value;

      let url =
        `${SUPABASE_URL}/rest/v1/slot?select=*&order=day.desc,slotid`;

      if (shop) {
        url +=
          `&shopid=eq.${encodeURIComponent(shop)}`;
      }


      const response = await fetch(
        url,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      const data = await response.json();


      const tbody =
        document.getElementById('slot-data');

      tbody.innerHTML = '';


      data.forEach(row => {

        tbody.innerHTML += `
          <tr>
            <td>${row.shopid}</td>
            <td>${row.slotid}</td>
            <td>${row.big}</td>
            <td>${row.reg}</td>
            <td>${row.count}</td>
            <td>${row.day}</td>
            <td>${row.name}</td>
            <td>${row.medal ?? ''}</td>
            <td>${row.rank ?? ''}</td>
          </tr>
        `;

      });
    }


    document
      .getElementById('shop-select')
      .addEventListener(
        'change',
        function () {

          const shop = this.value;

          if (shop) {

            history.replaceState(
              null,
              '',
              `?shop=${encodeURIComponent(shop)}`
            );

          } else {

            history.replaceState(
              null,
              '',
              location.pathname
            );
          }

          loadData();
        }
      );


    async function init() {

      await loadShops();

      await loadData();
    }


    init();

  </script>

</body>
</html>
