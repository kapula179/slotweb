<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Slot Data</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 12px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 19px;
      margin: 28px 0 10px;
    }

    .page-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .page-nav a {
      color: #1565c0;
      text-decoration: none;
    }

    .page-nav a[aria-current="page"] {
      color: #222;
      font-weight: bold;
    }

    .filters {
      background: white;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
    }

    .filter-row {
      margin-bottom: 10px;
    }

    .filter-row:last-child {
      margin-bottom: 0;
    }

    label {
      display: inline-block;
      width: 50px;
      font-weight: bold;
    }

    select {
      font-size: 16px;
      padding: 7px;
      width: calc(100% - 60px);
      max-width: 350px;
    }

    .day-controls {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: calc(100% - 60px);
      max-width: 440px;
      vertical-align: middle;
    }

    .day-controls select {
      flex: 1;
      min-width: 0;
      width: auto;
    }

    .day-navigation-button {
      flex: 0 0 auto;
      padding: 7px 11px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      background: #fff;
      color: #334155;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .day-navigation-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .result-info {
      margin: 10px 0;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 14px;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 7px 3px;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: #eee;
    }

    .positive {
      color: red;
    }

    .negative {
      color: blue;
    }

    .rank-badge {
      display: inline-block;
      min-width: 24px;
      padding: 3px 6px;
      border-radius: 999px;
      color: #fff;
      font-weight: bold;
      line-height: 1.2;
    }

    .rank-4 {
      background: #168aad;
    }

    .rank-5 {
      background: #e53935;
    }

    .rank-6 {
      color: #222;
      background: linear-gradient(
        90deg,
        #ff5252,
        #ffca28,
        #66bb6a,
        #29b6f6,
        #7e57c2,
        #ff5252
      );
      border: 1px solid rgba(0, 0, 0, 0.2);
      text-shadow: 0 1px 1px #fff;
    }

    .rank-row-4 {
      background: #d9f3fa;
    }

    .rank-row-5 {
      background: #ffe0e0;
    }

    .rank-row-6 {
      background: linear-gradient(
        90deg,
        #ffd6d6,
        #fff0b8,
        #d8f3dc,
        #d5ecff,
        #eadcff,
        #ffd6d6
      );
    }

    .rank-row-6 td {
      background: transparent;
    }

    .view-switcher {
      display: flex;
      gap: 8px;
      margin: 0 0 12px;
    }

    .view-button {
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #fff;
      color: #334155;
      padding: 7px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .view-button.active {
      border-color: #2563eb;
      background: #2563eb;
      color: #fff;
    }

    .week-scroll {
      overflow-x: auto;
      border: 1px solid #dbe3ec;
      border-radius: 8px;
      background: #fff;
    }

    .week-table {
      min-width: 800px;
      margin: 0;
      border-collapse: separate;
      border-spacing: 0;
    }

    .week-table th,
    .week-table td {
      min-width: 102px;
      padding: 8px 6px;
      text-align: center;
      border-right: 1px solid #e5e7eb;
      border-bottom: 1px solid #e5e7eb;
    }

    .week-table thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #edf2f7;
    }

    .week-table .week-slot-column {
      position: sticky;
      left: 0;
      z-index: 1;
      min-width: 64px;
      background: #f8fafc;
      font-weight: bold;
    }

    .week-table thead .week-slot-column {
      z-index: 3;
      background: #e2e8f0;
    }

    .week-cell-rank {
      display: block;
      font-weight: bold;
      font-size: 12px;
    }

    .week-cell-medal {
      display: block;
      margin-top: 3px;
      font-size: 13px;
    }

    .week-cell-rank-short,
    .week-cell-medal-short {
      display: none;
    }

    .week-rank-4 { background: #d9f3fa; }
    .week-rank-5 { background: #ffe0e0; }
    .week-rank-6 {
      background: linear-gradient(135deg, #ffd6d6, #fff0b8, #d8f3dc, #d5ecff, #eadcff);
    }

    .week-empty { color: #94a3b8; }

    .week-note {
      margin: 8px 2px 18px;
      color: #64748b;
      font-size: 12px;
    }

    .week-mobile-note {
      display: none;
    }

    @media (max-width: 600px) {
      .week-scroll {
        overflow-x: hidden;
      }

      .week-table {
        width: 100%;
        min-width: 0;
        table-layout: fixed;
      }

      .week-table th,
      .week-table td {
        width: calc((100% - 42px) / 7);
        min-width: 0;
        padding: 6px 1px;
        font-size: 10px;
        overflow: hidden;
      }

      .week-table .week-slot-column {
        width: 42px;
        min-width: 42px;
        font-size: 11px;
      }

      .week-cell-rank,
      .week-cell-medal {
        display: none;
      }

      .week-cell-rank-short,
      .week-cell-medal-short {
        display: block;
      }

      .week-cell-rank-short {
        min-height: 12px;
        font-weight: bold;
      }

      .week-cell-medal-short {
        margin-top: 2px;
        font-size: 9px;
      }

      .week-note {
        display: none;
      }

      .week-mobile-note {
        display: block;
        margin: -4px 0 8px;
        color: #64748b;
        font-size: 11px;
      }
    }

    .prediction-label {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 12px;
    }

    .prediction-hold {
      color: #4f4100;
      background: #ffe45c;
    }

    .prediction-raise {
      color: #9b1c1c;
      background: #ffe2e2;
    }

    .prediction-avoid {
      color: #0b4f8a;
      background: #dceeff;
    }

    .prediction-marginal {
      color: #5f6368;
      background: #f1f3f4;
      border: 1px dashed #aaa;
    }

    .prediction-note {
      color: #666;
      font-size: 12px;
      margin-top: 8px;
    }

    .sort-button {
      border: 0;
      padding: 0;
      color: inherit;
      background: transparent;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .sort-button:hover,
    .sort-button:focus-visible {
      color: #1565c0;
      text-decoration: underline;
    }

    .island-map {
      margin: 16px 0 22px;
      padding: 14px;
      background: #fff;
      border-radius: 8px;
    }

    .island-map h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .island-side {
      display: grid;
      grid-template-columns: repeat(14, minmax(74px, 1fr));
      gap: 5px;
      min-width: 1100px;
    }

    .island-detail {
      overflow-x: auto;
    }

    .island-detail-label {
      margin: 0 0 6px;
      color: #666;
      font-size: 12px;
    }

    .island-mini {
      display: block;
      width: 100%;
      max-width: 420px;
      margin-bottom: 16px;
    }

    .island-mini-label {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: bold;
    }

    .island-mini-side {
      display: grid;
      gap: 2px;
      width: 100%;
    }

    .island-mini-aisle {
      padding: 5px 0;
      color: #777;
      text-align: center;
      font-size: 9px;
      letter-spacing: 0.25em;
    }

    .island-mini-machine {
      min-width: 0;
      padding: 6px 0;
      border: 1px solid transparent;
      border-radius: 3px;
      color: #222;
      font-size: 10px;
      font-weight: bold;
      text-align: center;
    }

    .island-mini-machine.top-ranked {
      border-color: #d49b00;
      box-shadow: 0 0 0 1px #d49b00 inset;
    }

    .island-aisle {
      min-width: 1100px;
      padding: 12px 0;
      color: #777;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.4em;
    }

    .island-machine {
      min-height: 86px;
      padding: 7px 3px;
      border: 2px solid transparent;
      border-radius: 6px;
      color: #222;
      text-align: center;
      cursor: pointer;
    }

    .island-machine:hover,
    .island-machine:focus-visible {
      border-color: #1565c0;
      outline: none;
    }

    .island-machine.top-ranked {
      border-color: #d49b00;
      box-shadow: 0 0 0 1px #fff inset;
    }

    .island-slotid {
      display: block;
      font-size: 17px;
      font-weight: bold;
    }

    .island-grade,
    .island-medal,
    .island-rank {
      display: block;
      margin-top: 3px;
      font-size: 11px;
    }

    .island-medal {
      font-weight: bold;
    }

    @media (max-width: 600px) {
      body {
        margin: 8px;
      }

      h1 {
        font-size: 20px;
      }

      table {
        font-size: 12px;
      }

      th,
      td {
        padding: 6px 2px;
      }

      .island-map {
        padding: 10px 6px;
      }

    }
  </style>
</head>

<body>

  <h1>スロットデータ</h1>

  <nav class="page-nav" aria-label="実装の切り替え">
    <a href="index.html" aria-current="page">JavaScript</a>
    <a href="vue.html">Vue</a>
    <a href="react.html">React</a>
  </nav>

  <div class="filters">

    <div class="filter-row">
      <label for="shop-select">店舗</label>
      <select id="shop-select">
        <option value="">選択してください</option>
      </select>
    </div>

    <div class="filter-row">
      <label for="day-select">日付</label>
      <span class="day-controls">
        <select id="day-select" disabled>
          <option value="">選択してください</option>
        </select>
        <button id="previous-day-button" class="day-navigation-button" type="button" disabled>← 前日</button>
        <button id="next-day-button" class="day-navigation-button" type="button" disabled>翌日 →</button>
      </span>
    </div>

    <div class="filter-row">
      <label for="name-select">機種</label>
      <select id="name-select" disabled>
        <option value="">全機種</option>
      </select>
    </div>

  </div>

  <div class="view-switcher" aria-label="表示期間">
    <button id="single-view-button" class="view-button active" type="button">単日表示</button>
    <button id="weekly-view-button" class="view-button" type="button">7日間表示</button>
  </div>

  <section id="single-view">
    <div id="result-info" class="result-info"></div>

    <table>
    <thead>
      <tr>
        <th>台番</th>
        <th>BIG</th>
        <th>REG</th>
        <th>回転</th>
        <th>差枚</th>
        <th>RANK</th>
      </tr>
    </thead>

    <tbody id="slot-data"></tbody>
    </table>
  </section>

  <section id="weekly-view" hidden>
    <h2>過去7日間</h2>
    <div id="weekly-info" class="result-info"></div>
    <p class="week-mobile-note">上段：設定 / 下段：BIG・REG</p>
    <div class="week-scroll">
      <table class="week-table">
        <thead><tr id="weekly-head"></tr></thead>
        <tbody id="weekly-data"></tbody>
      </table>
    </div>
    <p class="week-note">最新日が左です。横にスクロールすると古い日付を確認できます。</p>
  </section>

  <section id="prediction-section" hidden>
    <h2 id="prediction-title">翌日予想</h2>
    <div id="prediction-info" class="result-info"></div>

    <div id="island-map" class="island-map" hidden>
      <h3 id="island-title">マイジャグラー島</h3>

      <div id="island-mini" class="island-mini">
        <p class="island-mini-label">全体ミニ島図</p>
        <div id="island-mini-top" class="island-mini-side"></div>
        <div id="island-mini-aisle" class="island-mini-aisle">通路</div>
        <div id="island-mini-bottom" class="island-mini-side"></div>
      </div>

      <div class="island-detail">
        <p class="island-detail-label">詳細島図（横スクロールできます）</p>
        <div id="island-top" class="island-side"></div>
        <div id="island-aisle" class="island-aisle">通路</div>
        <div id="island-bottom" class="island-side"></div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>
            <button class="sort-button" type="button" data-sort-key="slotid"
              onclick="sortPredictionTable('slotid', this)">
              台番 ↑
            </button>
          </th>
          <th>
            <button class="sort-button" type="button" data-sort-key="grade"
              onclick="sortPredictionTable('grade', this)">
              判定 ↕
            </button>
          </th>
          <th>
            <button class="sort-button" type="button" data-sort-key="rank"
              onclick="sortPredictionTable('rank', this)">
              ワースト順位 ↕
            </button>
          </th>
        </tr>
      </thead>
      <tbody id="prediction-data"></tbody>
    </table>

    <p class="prediction-note">
      過去データに基づく参考情報であり、実際の設定や結果を保証するものではありません。
    </p>
  </section>

  <script>
    const SUPABASE_URL =
      'https://cbakwimqxhfbqdnvyeoi.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_CIVy_I-SIKBrfNfXa1sGYQ_b3sMvKMm';


    const headers = {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    };

    let currentView = 'single';


    async function fetchJson(url) {
      const response = await fetch(url, { headers });

      if (!response.ok) {
        throw new Error(
          `HTTP ${response.status}`
        );
      }

      return await response.json();
    }


    function setSelectOptions(
      selectId,
      values,
      firstLabel
    ) {
      const select =
        document.getElementById(selectId);

      select.innerHTML =
        `<option value="">${firstLabel}</option>`;

      values.forEach(value => {
        const option =
          document.createElement('option');

        option.value = value;
        option.textContent = value;

        select.appendChild(option);
      });
    }


    // 店舗一覧
    // shop_list VIEWを使用
    async function loadShops() {

      const url =
        `${SUPABASE_URL}/rest/v1/shop_list` +
        `?select=shopid` +
        `&order=shopid`;

      const data =
        await fetchJson(url);

      const shops =
        data
          .map(row => row.shopid)
          .filter(Boolean);

      setSelectOptions(
        'shop-select',
        shops,
        '選択してください'
      );
    }


    // 日付一覧
    // shop_day_list VIEWを使用
    async function loadDays(shop) {

      const daySelect =
        document.getElementById('day-select');

      const nameSelect =
        document.getElementById('name-select');

      daySelect.disabled = true;
      nameSelect.disabled = true;

      setSelectOptions(
        'day-select',
        [],
        '選択してください'
      );

      setSelectOptions(
        'name-select',
        [],
        '全機種'
      );

      clearTable();

      if (!shop) {
        return;
      }

      const url =
        `${SUPABASE_URL}/rest/v1/shop_day_list` +
        `?select=day` +
        `&shopid=eq.${encodeURIComponent(shop)}` +
        `&order=day.desc`;

      const data =
        await fetchJson(url);

      const days =
        data
          .map(row => row.day)
          .filter(Boolean);

      setSelectOptions(
        'day-select',
        days,
        '選択してください'
      );

      daySelect.disabled = false;
      updateDayNavigationButtons();
    }


    // 機種一覧
    // shop_day_name_list VIEWを使用
    async function loadNames(shop, day) {

      const nameSelect =
        document.getElementById('name-select');

      nameSelect.disabled = true;

      setSelectOptions(
        'name-select',
        [],
        '全機種'
      );

      if (!shop || !day) {
        return;
      }

      const url =
        `${SUPABASE_URL}/rest/v1/shop_day_name_list` +
        `?select=name` +
        `&shopid=eq.${encodeURIComponent(shop)}` +
        `&day=eq.${encodeURIComponent(day)}` +
        `&order=name`;

      const data =
        await fetchJson(url);

      const names =
        data
          .map(row => row.name)
          .filter(Boolean);

      setSelectOptions(
        'name-select',
        names,
        '全機種'
      );

      nameSelect.disabled = false;
    }


    function getPreviousDays(day, count) {
      const [year, month, date] = day.split('-').map(Number);
      const base = new Date(Date.UTC(year, month - 1, date));

      return Array.from({ length: count }, (_, index) => {
        const target = new Date(base);
        target.setUTCDate(base.getUTCDate() - index);
        return target.toISOString().slice(0, 10);
      });
    }


    function updateDayNavigationButtons() {
      const daySelect = document.getElementById('day-select');
      const previousButton = document.getElementById('previous-day-button');
      const nextButton = document.getElementById('next-day-button');
      const hasOlderDay =
        daySelect.value &&
        daySelect.selectedIndex > 0 &&
        daySelect.selectedIndex < daySelect.options.length - 1;
      const hasNewerDay =
        daySelect.value &&
        daySelect.selectedIndex > 1;
      const hidden = currentView !== 'single';

      previousButton.disabled = hidden || !hasOlderDay;
      nextButton.disabled = hidden || !hasNewerDay;
      previousButton.hidden = hidden;
      nextButton.hidden = hidden;
    }


    async function moveDay(optionOffset) {
      const daySelect = document.getElementById('day-select');
      const targetIndex = daySelect.selectedIndex + optionOffset;

      if (
        !daySelect.value ||
        targetIndex < 1 ||
        targetIndex >= daySelect.options.length
      ) {
        updateDayNavigationButtons();
        return;
      }

      const shop = document.getElementById('shop-select').value;
      const nameSelect = document.getElementById('name-select');
      const currentName = nameSelect.value;

      daySelect.selectedIndex = targetIndex;
      await loadNames(shop, daySelect.value);

      if (
        currentName &&
        [...nameSelect.options].some(option => option.value === currentName)
      ) {
        nameSelect.value = currentName;
      }

      updateDayNavigationButtons();
      await loadData();
    }


    const goToPreviousDay = () => moveDay(1);
    const goToNextDay = () => moveDay(-1);


    function formatShortDay(day) {
      const [, month, date] = day.split('-');
      return `${Number(month)}/${Number(date)}`;
    }


    function calculateEstimatedMedal(row) {
      const big = Number(row.big);
      const reg = Number(row.reg);
      const count = Number(row.count);

      if (![big, reg, count].every(Number.isFinite)) {
        return null;
      }

      return Math.round(big * 240 + reg * 96 - count * 1.25);
    }


    function setWeeklyMessage(message) {
      document.getElementById('weekly-info').textContent = message;
    }


    function clearWeeklyData(message = '') {
      document.getElementById('weekly-head').innerHTML = '';
      document.getElementById('weekly-data').innerHTML = '';
      setWeeklyMessage(message);
    }


    async function loadWeeklyData() {
      const shop = document.getElementById('shop-select').value;
      const day = document.getElementById('day-select').value;
      const name = document.getElementById('name-select').value;

      if (!shop || !day) {
        clearWeeklyData('店舗と基準日を選択してください。');
        return;
      }

      if (!name) {
        clearWeeklyData('7日間表示では機種を選択してください。');
        return;
      }

      setWeeklyMessage('7日間のデータを読み込み中…');
      const days = getPreviousDays(day, 7);
      const url =
        `${SUPABASE_URL}/rest/v1/slot` +
        `?select=day,slotid,name,big,reg,count,rank` +
        `&shopid=eq.${encodeURIComponent(shop)}` +
        `&name=eq.${encodeURIComponent(name)}` +
        `&day=gte.${days[days.length - 1]}` +
        `&day=lte.${days[0]}` +
        `&order=slotid,day.desc&limit=1000`;

      try {
        const data = await fetchJson(url);
        const bySlot = new Map();

        data.forEach(row => {
          const slotId = String(row.slotid ?? '');
          if (!bySlot.has(slotId)) bySlot.set(slotId, new Map());
          bySlot.get(slotId).set(row.day, row);
        });

        const head = document.getElementById('weekly-head');
        head.innerHTML = '<th class="week-slot-column">台番</th>';
        days.forEach(targetDay => {
          const th = document.createElement('th');
          th.textContent = formatShortDay(targetDay);
          th.title = targetDay;
          head.appendChild(th);
        });

        const tbody = document.getElementById('weekly-data');
        tbody.innerHTML = '';
        const slotIds = [...bySlot.keys()].sort((a, b) =>
          a.localeCompare(b, 'ja', { numeric: true })
        );

        slotIds.forEach(slotId => {
          const tr = document.createElement('tr');
          const slotCell = document.createElement('th');
          slotCell.className = 'week-slot-column';
          slotCell.scope = 'row';
          slotCell.textContent = slotId;
          tr.appendChild(slotCell);

          days.forEach(targetDay => {
            const td = document.createElement('td');
            const row = bySlot.get(slotId).get(targetDay);

            if (!row) {
              td.className = 'week-empty';
              td.textContent = '—';
            } else {
              const rank = row.rank == null ? '' : String(row.rank).trim();
              const medal = calculateEstimatedMedal(row);
              if (['4', '5', '6'].includes(rank)) {
                td.classList.add(`week-rank-${rank}`);
              }
              td.title = `BIG ${row.big ?? '-'} / REG ${row.reg ?? '-'} / ${row.count ?? '-'}G`;

              const rankSpan = document.createElement('span');
              rankSpan.className = 'week-cell-rank';
              rankSpan.textContent = rank ? `RANK ${rank}` : 'RANK —';
              td.appendChild(rankSpan);

              const shortRankSpan = document.createElement('span');
              shortRankSpan.className = 'week-cell-rank-short';
              shortRankSpan.textContent = rank || '—';
              td.appendChild(shortRankSpan);

              const medalSpan = document.createElement('span');
              medalSpan.className = 'week-cell-medal';
              medalSpan.textContent = medal == null
                ? '差枚 —'
                : `${medal > 0 ? '+' : ''}${medal.toLocaleString()}枚`;
              td.appendChild(medalSpan);

              const shortMedalSpan = document.createElement('span');
              shortMedalSpan.className = 'week-cell-medal-short';
              shortMedalSpan.textContent =
                `${row.big ?? '-'}/${row.reg ?? '-'}`;
              td.appendChild(shortMedalSpan);
            }

            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });

        setWeeklyMessage(`${slotIds.length}台 / ${shop} / ${name} / ${days[6]}〜${days[0]}`);
        updateUrl(shop, day, name);
      } catch (error) {
        console.error('7日間データ取得エラー:', error);
        clearWeeklyData('7日間のデータ取得に失敗しました。');
      }
    }


    async function switchView(view) {
      currentView = view;
      const weekly = view === 'weekly';
      document.getElementById('single-view').hidden = weekly;
      document.getElementById('weekly-view').hidden = !weekly;
      document.getElementById('prediction-section').hidden = weekly;
      document.getElementById('single-view-button').classList.toggle('active', !weekly);
      document.getElementById('weekly-view-button').classList.toggle('active', weekly);
      updateDayNavigationButtons();

      if (weekly) {
        await loadWeeklyData();
      } else {
        await loadData();
      }
    }


    // 実データ取得
    async function loadData() {

      const shop =
        document.getElementById(
          'shop-select'
        ).value;

      const day =
        document.getElementById(
          'day-select'
        ).value;

      const name =
        document.getElementById(
          'name-select'
        ).value;


      if (!shop || !day) {
        clearTable();
        return;
      }


      let url =
        `${SUPABASE_URL}/rest/v1/slot` +
        `?select=slotid,big,reg,count,medal,rank` +
        `&shopid=eq.${encodeURIComponent(shop)}` +
        `&day=eq.${encodeURIComponent(day)}`;


      if (name) {
        url +=
          `&name=eq.${encodeURIComponent(name)}`;
      }


      url += `&order=slotid`;


      const data =
        await fetchJson(url);


      displayData(
        data,
        shop,
        day,
        name
      );


      try {
        await loadPredictions(
          shop,
          day,
          name
        );
      } catch (error) {
        console.error(
          '予想データ取得エラー:',
          error
        );
      }


      updateUrl(
        shop,
        day,
        name
      );

      updateDayNavigationButtons();

      if (currentView === 'weekly') {
        document.getElementById('prediction-section').hidden = true;
        await loadWeeklyData();
      }
    }


    function getNextDay(day) {

      const parts =
        day.split('-').map(Number);

      const date = new Date(Date.UTC(
        parts[0],
        parts[1] - 1,
        parts[2] + 1
      ));

      return date
        .toISOString()
        .slice(0, 10);
    }


    async function loadPredictions(
      shop,
      sourceDay,
      name
    ) {

      clearPredictions();

      if (!shop || !sourceDay) {
        return;
      }

      const predictionDay =
        getNextDay(sourceDay);

      let url =
        `${SUPABASE_URL}/rest/v1/predictions` +
        `?select=slotid,name,score,grade,reasons` +
        `&shopid=eq.${encodeURIComponent(shop)}` +
        `&prediction_day=eq.${predictionDay}` +
        `&model_version=eq.myjuggler_2day_v1`;

      if (name) {
        url +=
          `&name=eq.${encodeURIComponent(name)}`;
      }

      url +=
        `&order=score.desc,slotid.asc`;

      const data =
        await fetchJson(url);

      if (!data.length) {
        return;
      }

      displayPredictions(
        data,
        predictionDay,
        shop
      );
    }


    function displayPredictions(
      data,
      predictionDay,
      shop
    ) {

      const section =
        document.getElementById(
          'prediction-section'
        );

      const tbody =
        document.getElementById(
          'prediction-data'
        );

      const counts = {
        hold_misfire: 0,
        raise_candidate: 0,
        avoid_recent_high: 0,
        marginal: 0
      };

      const rankedRows =
        data
          .map(row => {
            const reasons =
              Array.isArray(row.reasons)
                ? row.reasons
                : [];
            const oldDay = reasons[0] || {};
            const previousDay = reasons[1] || {};
            const oldMedal =
              oldDay.estimated_medal ??
              oldDay.medal;
            const previousMedal =
              previousDay.estimated_medal ??
              previousDay.medal;

            return {
              row,
              twoDayMedal:
                oldMedal === null ||
                oldMedal === undefined ||
                previousMedal === null ||
                previousMedal === undefined
                  ? null
                  : Number(oldMedal) +
                    Number(previousMedal)
            };
          })
          .sort((left, right) => {
            if (left.twoDayMedal === null) return 1;
            if (right.twoDayMedal === null) return -1;
            return left.twoDayMedal - right.twoDayMedal;
          });

      const worstRanks = new Map();

      rankedRows.forEach((item, index) => {
        if (item.twoDayMedal !== null) {
          worstRanks.set(
            item.row.slotid,
            index + 1
          );
        }
      });

      resetPredictionTableSort();
      tbody.innerHTML = '';

      data
        .slice()
        .sort((left, right) =>
          String(left.slotid).localeCompare(
            String(right.slotid),
            'ja',
            { numeric: true }
          )
        )
        .forEach(row => {

        if (counts[row.grade] !== undefined) {
          counts[row.grade]++;
        }

        const prediction =
          getPredictionPresentation(
            row.grade
          );

        const tr =
          document.createElement('tr');

        tr.id =
          `prediction-slot-${row.slotid}`;

        tr.dataset.slotid = row.slotid;
        tr.dataset.grade =
          getPredictionGradeOrder(
            row.grade
          );
        tr.dataset.rank =
          worstRanks.get(row.slotid) ?? '';

        appendCell(tr, row.slotid);

        const labelCell =
          document.createElement('td');

        const label =
          document.createElement('span');

        label.className =
          `prediction-label ${prediction.className}`;

        label.textContent =
          prediction.label;

        labelCell.appendChild(label);
        tr.appendChild(labelCell);

        appendCell(
          tr,
          worstRanks.get(row.slotid)
        );

        tbody.appendChild(tr);
      });

      document
        .getElementById('prediction-title')
        .textContent =
          `${predictionDay} 翌日予想`;

      document
        .getElementById('prediction-info')
        .textContent =
          `${data.length}台 / ` +
          `据え置き ${counts.hold_misfire}台 / ` +
          `上げ ${counts.raise_candidate}台 / ` +
          `回避 ${counts.avoid_recent_high}台 / ` +
          `保留 ${counts.marginal}台`;

      section.hidden = false;

      displayIslandMap(
        shop,
        data,
        worstRanks
      );
    }


    function getPredictionGradeOrder(grade) {

      const order = {
        raise_candidate: 1,
        hold_misfire: 2,
        avoid_recent_high: 3,
        marginal: 4
      };

      return order[grade] ?? 99;
    }


    const predictionTableDirections = {
      slotid: 'asc',
      grade: 'none',
      rank: 'none'
    };


    function resetPredictionTableSort() {

      predictionTableDirections.slotid = 'asc';
      predictionTableDirections.grade = 'none';
      predictionTableDirections.rank = 'none';

      const labels = {
        slotid: '台番 ↑',
        grade: '判定 ↕',
        rank: 'ワースト順位 ↕'
      };

      document
        .querySelectorAll('.sort-button')
        .forEach(button => {
          button.textContent =
            labels[button.dataset.sortKey];
        });
    }


    function sortPredictionTable(
      key,
      button
    ) {

      const tbody =
        document.getElementById(
          'prediction-data'
        );

      const direction =
        predictionTableDirections[key] === 'asc'
          ? 'desc'
          : 'asc';

      predictionTableDirections.slotid = 'none';
      predictionTableDirections.grade = 'none';
      predictionTableDirections.rank = 'none';
      predictionTableDirections[key] = direction;

      const rows =
        Array.from(tbody.rows);

      rows.sort((left, right) => {

        const leftText = left.dataset[key];
        const rightText = right.dataset[key];

        if (leftText === '' && rightText === '') return 0;
        if (leftText === '') return 1;
        if (rightText === '') return -1;

        const comparison = key === 'slotid'
          ? leftText.localeCompare(
              rightText,
              'ja',
              { numeric: true }
            )
          : Number(leftText) - Number(rightText);

        return direction === 'asc'
          ? comparison
          : -comparison;
      });

      rows.forEach(row =>
        tbody.appendChild(row)
      );

      document
        .querySelectorAll('.sort-button')
        .forEach(item => {
          item.textContent =
            item.textContent
              .replace(/[↑↓↕]/g, '')
              .trim() + ' ↕';
        });

      button.textContent =
        button.textContent
          .replace(/[↑↓↕]/g, '')
          .trim() +
        (direction === 'asc' ? ' ↑' : ' ↓');
    }


    function displayIslandMap(
      shop,
      data,
      worstRanks
    ) {

      const map =
        document.getElementById('island-map');

      map.hidden = true;

      const layouts = {
        'テキサス八木': {
          title: 'テキサス八木 マイジャグラー島',
          top: Array.from(
            { length: 14 },
            (_, index) => 25 + index
          ),
          bottom: Array.from(
            { length: 14 },
            (_, index) => 82 - index
          )
        },
        'ZAPP高陽': {
          title: 'ZAPP高陽 マイジャグラー島',
          top: Array.from(
            { length: 10 },
            (_, index) => 183 + index
          ),
          bottom: null
        }
      };

      const layout = layouts[shop];

      if (!layout) {
        return;
      }

      const rowsBySlot = new Map(
        data.map(row => [
          String(row.slotid),
          row
        ])
      );

      document
        .getElementById('island-title')
        .textContent = layout.title;

      renderIslandSide(
        'island-top',
        layout.top,
        rowsBySlot,
        worstRanks
      );

      renderMiniIslandSide(
        'island-mini-top',
        layout.top,
        rowsBySlot,
        worstRanks
      );

      const aisle =
        document.getElementById(
          'island-aisle'
        );

      const bottom =
        document.getElementById(
          'island-bottom'
        );

      const miniAisle =
        document.getElementById(
          'island-mini-aisle'
        );

      const miniBottom =
        document.getElementById(
          'island-mini-bottom'
        );

      if (layout.bottom) {
        aisle.hidden = false;
        bottom.hidden = false;

        renderIslandSide(
          'island-bottom',
          layout.bottom,
          rowsBySlot,
          worstRanks
        );

        miniAisle.hidden = false;
        miniBottom.hidden = false;

        renderMiniIslandSide(
          'island-mini-bottom',
          layout.bottom,
          rowsBySlot,
          worstRanks
        );
      } else {
        aisle.hidden = true;
        bottom.hidden = true;
        bottom.innerHTML = '';
        miniAisle.hidden = true;
        miniBottom.hidden = true;
        miniBottom.innerHTML = '';
      }

      map.hidden = false;
    }


    function renderMiniIslandSide(
      elementId,
      slotIds,
      rowsBySlot,
      worstRanks
    ) {

      const side =
        document.getElementById(elementId);

      side.innerHTML = '';
      side.style.gridTemplateColumns =
        `repeat(${slotIds.length}, minmax(0, 1fr))`;

      slotIds.forEach(slotId => {

        const row =
          rowsBySlot.get(String(slotId));

        const machine =
          document.createElement('span');

        machine.className =
          'island-mini-machine';

        machine.textContent = slotId;

        if (row) {
          const prediction =
            getPredictionPresentation(
              row.grade
            );

          machine.classList.add(
            prediction.className
          );

          const rank =
            worstRanks.get(row.slotid);

          if (rank && rank <= 10) {
            machine.classList.add(
              'top-ranked'
            );
          }
        } else {
          machine.classList.add(
            'prediction-marginal'
          );
        }

        side.appendChild(machine);
      });
    }


    function renderIslandSide(
      elementId,
      slotIds,
      rowsBySlot,
      worstRanks
    ) {

      const side =
        document.getElementById(elementId);

      side.innerHTML = '';
      side.style.gridTemplateColumns =
        `repeat(${slotIds.length}, minmax(74px, 1fr))`;
      side.style.minWidth =
        `${slotIds.length * 79}px`;

      slotIds.forEach(slotId => {

        const row =
          rowsBySlot.get(String(slotId));

        const machine =
          document.createElement('button');

        machine.type = 'button';
        machine.className = 'island-machine';

        if (!row) {
          machine.disabled = true;
          machine.classList.add(
            'prediction-marginal'
          );
          appendIslandText(
            machine,
            slotId,
            'island-slotid'
          );
          appendIslandText(
            machine,
            'データなし',
            'island-grade'
          );
          side.appendChild(machine);
          return;
        }

        const prediction =
          getPredictionPresentation(
            row.grade
          );

        const reasons =
          Array.isArray(row.reasons)
            ? row.reasons
            : [];

        const oldDay = reasons[0] || {};
        const previousDay = reasons[1] || {};
        const oldMedal =
          oldDay.estimated_medal ??
          oldDay.medal;
        const previousMedal =
          previousDay.estimated_medal ??
          previousDay.medal;
        const total =
          oldMedal === null ||
          oldMedal === undefined ||
          previousMedal === null ||
          previousMedal === undefined
            ? null
            : Number(oldMedal) +
              Number(previousMedal);
        const rank =
          worstRanks.get(row.slotid);

        machine.classList.add(
          prediction.className
        );

        if (rank && rank <= 10) {
          machine.classList.add('top-ranked');
        }

        machine.addEventListener(
          'click',
          () => {
            document
              .getElementById(
                `prediction-slot-${row.slotid}`
              )
              ?.scrollIntoView({
                behavior: 'smooth',
                block: 'center'
              });
          }
        );

        appendIslandText(
          machine,
          slotId,
          'island-slotid'
        );
        appendIslandText(
          machine,
          prediction.label,
          'island-grade'
        );
        appendIslandText(
          machine,
          total === null
            ? '2日 -'
            : `2日 ${formatSignedNumber(total)}`,
          'island-medal'
        );
        appendIslandText(
          machine,
          rank ? `WORST ${rank}位` : '-',
          'island-rank'
        );

        side.appendChild(machine);
      });
    }


    function appendIslandText(
      parent,
      text,
      className
    ) {

      const element =
        document.createElement('span');

      element.className = className;
      element.textContent = text;
      parent.appendChild(element);
    }


    function formatSignedNumber(value) {

      const number = Number(value);

      return number > 0
        ? `+${number}`
        : `${number}`;
    }


    function getPredictionPresentation(grade) {

      const presentations = {
        hold_misfire: {
          label: '不発据え置き',
          className: 'prediction-hold'
        },
        raise_candidate: {
          label: '上げ候補',
          className: 'prediction-raise'
        },
        avoid_recent_high: {
          label: 'スルー',
          className: 'prediction-avoid'
        },
        marginal: {
          label: '保留',
          className: 'prediction-marginal'
        }
      };

      return presentations[grade] || {
        label: grade || '',
        className: ''
      };
    }


    function appendCell(row, value) {

      const cell =
        document.createElement('td');

      cell.textContent =
        value ?? '';

      row.appendChild(cell);
    }


    function clearPredictions() {

      document
        .getElementById('prediction-data')
        .innerHTML = '';

      document
        .getElementById('prediction-info')
        .textContent = '';

      document
        .getElementById('prediction-section')
        .hidden = true;

      document
        .getElementById('island-map')
        .hidden = true;
    }


    function displayData(
      data,
      shop,
      day,
      name
    ) {

      const tbody =
        document.getElementById(
          'slot-data'
        );

      tbody.innerHTML = '';


      data.forEach(row => {

        let medalClass = '';

        if (row.medal > 0) {
          medalClass = 'positive';
        } else if (row.medal < 0) {
          medalClass = 'negative';
        }


        let medalText = '';

        if (row.medal !== null) {
          medalText =
            row.medal > 0
              ? `+${row.medal}`
              : row.medal;
        }


        const rankText =
          row.rank == null
            ? ''
            : String(row.rank).trim();

        const rankClass =
          ['4', '5', '6'].includes(rankText)
            ? `rank-badge rank-${rankText}`
            : '';

        const rankRowClass =
          ['4', '5', '6'].includes(rankText)
            ? `rank-row-${rankText}`
            : '';

        const rankHtml = rankText
          ? `<span class="${rankClass}">${rankText}</span>`
          : '';


        tbody.innerHTML += `
          <tr class="${rankRowClass}">
            <td>${row.slotid ?? ''}</td>
            <td>${row.big ?? ''}</td>
            <td>${row.reg ?? ''}</td>
            <td>${row.count ?? ''}</td>

            <td class="${medalClass}">
              ${medalText}
            </td>

            <td>${rankHtml}</td>
          </tr>
        `;
      });


      let info =
        `${data.length}台 / ${shop} / ${day}`;

      if (name) {
        info += ` / ${name}`;
      }


      document
        .getElementById('result-info')
        .textContent = info;
    }


    function clearTable() {

      document
        .getElementById('slot-data')
        .innerHTML = '';

      document
        .getElementById('result-info')
        .textContent = '';

      clearPredictions();
    }


    function updateUrl(
      shop,
      day,
      name
    ) {

      const params =
        new URLSearchParams();

      if (shop) {
        params.set('shop', shop);
      }

      if (day) {
        params.set('day', day);
      }

      if (name) {
        params.set('name', name);
      }


      const query =
        params.toString();

      const url =
        query
          ? `${location.pathname}?${query}`
          : location.pathname;


      history.replaceState(
        null,
        '',
        url
      );
    }


    async function loadFromUrl() {

      const params =
        new URLSearchParams(
          location.search
        );

      const shop =
        params.get('shop');

      const day =
        params.get('day');

      const name =
        params.get('name');


      if (!shop) {
        return;
      }


      const shopSelect =
        document.getElementById(
          'shop-select'
        );

      shopSelect.value = shop;


      await loadDays(shop);


      if (!day) {
        return;
      }


      const daySelect =
        document.getElementById(
          'day-select'
        );

      daySelect.value = day;


      await loadNames(
        shop,
        day
      );


      if (name) {
        document
          .getElementById(
            'name-select'
          )
          .value = name;
      }


      await loadData();
    }


    document
      .getElementById('shop-select')
      .addEventListener(
        'change',
        async function () {

          await loadDays(
            this.value
          );

          updateUrl(
            this.value,
            '',
            ''
          );
        }
      );


    document
      .getElementById('day-select')
      .addEventListener(
        'change',
        async function () {

          const shop =
            document
              .getElementById(
                'shop-select'
              )
              .value;

          const day =
            this.value;


          await loadNames(
            shop,
            day
          );


          await loadData();
          updateDayNavigationButtons();
        }
      );


    document
      .getElementById('name-select')
      .addEventListener(
        'change',
        loadData
      );


    document
      .getElementById('single-view-button')
      .addEventListener('click', () => switchView('single'));

    document
      .getElementById('weekly-view-button')
      .addEventListener('click', () => switchView('weekly'));

    document
      .getElementById('previous-day-button')
      .addEventListener('click', goToPreviousDay);

    document
      .getElementById('next-day-button')
      .addEventListener('click', goToNextDay);


    async function init() {

      try {

        await loadShops();

        await loadFromUrl();

      } catch (error) {

        console.error(error);

        document
          .getElementById(
            'result-info'
          )
          .textContent =
            'データ取得に失敗しました。';
      }
    }


    init();

  </script>
