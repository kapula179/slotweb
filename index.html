<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Slot Data</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 12px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 16px;
    }

    .filters {
      background: white;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
    }

    .filter-row {
      margin-bottom: 10px;
    }

    .filter-row:last-child {
      margin-bottom: 0;
    }

    label {
      display: inline-block;
      width: 50px;
      font-weight: bold;
    }

    select {
      font-size: 16px;
      padding: 7px;
      width: calc(100% - 60px);
      max-width: 350px;
    }

    .result-info {
      margin: 10px 0;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 14px;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 7px 3px;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: #eee;
    }

    .positive {
      color: red;
    }

    .negative {
      color: blue;
    }

    @media (max-width: 600px) {
      body {
        margin: 8px;
      }

      h1 {
        font-size: 20px;
      }

      table {
        font-size: 12px;
      }

      th,
      td {
        padding: 6px 2px;
      }
    }
  </style>
</head>

<body>

  <h1>スロットデータ</h1>

  <div class="filters">

    <div class="filter-row">
      <label for="shop-select">店舗</label>
      <select id="shop-select">
        <option value="">選択してください</option>
      </select>
    </div>

    <div class="filter-row">
      <label for="day-select">日付</label>
      <select id="day-select" disabled>
        <option value="">選択してください</option>
      </select>
    </div>

    <div class="filter-row">
      <label for="name-select">機種</label>
      <select id="name-select" disabled>
        <option value="">全機種</option>
      </select>
    </div>

  </div>

  <div id="result-info" class="result-info"></div>

  <table>
    <thead>
      <tr>
        <th>台番</th>
        <th>BIG</th>
        <th>REG</th>
        <th>回転</th>
        <th>差枚</th>
        <th>RANK</th>
      </tr>
    </thead>

    <tbody id="slot-data"></tbody>
  </table>

  <script>
    const SUPABASE_URL =
      'https://cbakwimqxhfbqdnvyeoi.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_CIVy_I-SIKBrfNfXa1sGYQ_b3sMvKMm';


    const headers = {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    };


    async function fetchJson(url) {
      const response = await fetch(url, { headers });

      if (!response.ok) {
        throw new Error(
          `HTTP ${response.status}`
        );
      }

      return await response.json();
    }


    function setSelectOptions(
      selectId,
      values,
      firstLabel
    ) {
      const select =
        document.getElementById(selectId);

      select.innerHTML =
        `<option value="">${firstLabel}</option>`;

      values.forEach(value => {
        const option =
          document.createElement('option');

        option.value = value;
        option.textContent = value;

        select.appendChild(option);
      });
    }


    // 店舗一覧
    // shop_list VIEWを使用
    async function loadShops() {

      const url =
        `${SUPABASE_URL}/rest/v1/shop_list` +
        `?select=shopid` +
        `&order=shopid`;

      const data =
        await fetchJson(url);

      const shops =
        data
          .map(row => row.shopid)
          .filter(Boolean);

      setSelectOptions(
        'shop-select',
        shops,
        '選択してください'
      );
    }


    // 日付一覧
    // shop_day_list VIEWを使用
    async function loadDays(shop) {

      const daySelect =
        document.getElementById('day-select');

      const nameSelect =
        document.getElementById('name-select');

      daySelect.disabled = true;
      nameSelect.disabled = true;

      setSelectOptions(
        'day-select',
        [],
        '選択してください'
      );

      setSelectOptions(
        'name-select',
        [],
        '全機種'
      );

      clearTable();

      if (!shop) {
        return;
      }

      const url =
        `${SUPABASE_URL}/rest/v1/shop_day_list` +
        `?select=day` +
        `&shopid=eq.${encodeURIComponent(shop)}` +
        `&order=day.desc`;

      const data =
        await fetchJson(url);

      const days =
        data
          .map(row => row.day)
          .filter(Boolean);

      setSelectOptions(
        'day-select',
        days,
        '選択してください'
      );

      daySelect.disabled = false;
    }


    // 機種一覧
    // shop_day_name_list VIEWを使用
    async function loadNames(shop, day) {

      const nameSelect =
        document.getElementById('name-select');

      nameSelect.disabled = true;

      setSelectOptions(
        'name-select',
        [],
        '全機種'
      );

      if (!shop || !day) {
        return;
      }

      const url =
        `${SUPABASE_URL}/rest/v1/shop_day_name_list` +
        `?select=name` +
        `&shopid=eq.${encodeURIComponent(shop)}` +
        `&day=eq.${encodeURIComponent(day)}` +
        `&order=name`;

      const data =
        await fetchJson(url);

      const names =
        data
          .map(row => row.name)
          .filter(Boolean);

      setSelectOptions(
        'name-select',
        names,
        '全機種'
      );

      nameSelect.disabled = false;
    }


    // 実データ取得
    async function loadData() {

      const shop =
        document.getElementById(
          'shop-select'
        ).value;

      const day =
        document.getElementById(
          'day-select'
        ).value;

      const name =
        document.getElementById(
          'name-select'
        ).value;


      if (!shop || !day) {
        clearTable();
        return;
      }


      let url =
        `${SUPABASE_URL}/rest/v1/slot` +
        `?select=slotid,big,reg,count,medal,rank` +
        `&shopid=eq.${encodeURIComponent(shop)}` +
        `&day=eq.${encodeURIComponent(day)}`;


      if (name) {
        url +=
          `&name=eq.${encodeURIComponent(name)}`;
      }


      url += `&order=slotid`;


      const data =
        await fetchJson(url);


      displayData(
        data,
        shop,
        day,
        name
      );


      updateUrl(
        shop,
        day,
        name
      );
    }


    function displayData(
      data,
      shop,
      day,
      name
    ) {

      const tbody =
        document.getElementById(
          'slot-data'
        );

      tbody.innerHTML = '';


      data.forEach(row => {

        let medalClass = '';

        if (row.medal > 0) {
          medalClass = 'positive';
        } else if (row.medal < 0) {
          medalClass = 'negative';
        }


        let medalText = '';

        if (row.medal !== null) {
          medalText =
            row.medal > 0
              ? `+${row.medal}`
              : row.medal;
        }


        tbody.innerHTML += `
          <tr>
            <td>${row.slotid ?? ''}</td>
            <td>${row.big ?? ''}</td>
            <td>${row.reg ?? ''}</td>
            <td>${row.count ?? ''}</td>

            <td class="${medalClass}">
              ${medalText}
            </td>

            <td>${row.rank ?? ''}</td>
          </tr>
        `;
      });


      let info =
        `${data.length}台 / ${shop} / ${day}`;

      if (name) {
        info += ` / ${name}`;
      }


      document
        .getElementById('result-info')
        .textContent = info;
    }


    function clearTable() {

      document
        .getElementById('slot-data')
        .innerHTML = '';

      document
        .getElementById('result-info')
        .textContent = '';
    }


    function updateUrl(
      shop,
      day,
      name
    ) {

      const params =
        new URLSearchParams();

      if (shop) {
        params.set('shop', shop);
      }

      if (day) {
        params.set('day', day);
      }

      if (name) {
        params.set('name', name);
      }


      const query =
        params.toString();

      const url =
        query
          ? `${location.pathname}?${query}`
          : location.pathname;


      history.replaceState(
        null,
        '',
        url
      );
    }


    async function loadFromUrl() {

      const params =
        new URLSearchParams(
          location.search
        );

      const shop =
        params.get('shop');

      const day =
        params.get('day');

      const name =
        params.get('name');


      if (!shop) {
        return;
      }


      const shopSelect =
        document.getElementById(
          'shop-select'
        );

      shopSelect.value = shop;


      await loadDays(shop);


      if (!day) {
        return;
      }


      const daySelect =
        document.getElementById(
          'day-select'
        );

      daySelect.value = day;


      await loadNames(
        shop,
        day
      );


      if (name) {
        document
          .getElementById(
            'name-select'
          )
          .value = name;
      }


      await loadData();
    }


    document
      .getElementById('shop-select')
      .addEventListener(
        'change',
        async function () {

          await loadDays(
            this.value
          );

          updateUrl(
            this.value,
            '',
            ''
          );
        }
      );


    document
      .getElementById('day-select')
      .addEventListener(
        'change',
        async function () {

          const shop =
            document
              .getElementById(
                'shop-select'
              )
              .value;

          const day =
            this.value;


          await loadNames(
            shop,
            day
          );


          await loadData();
        }
      );


    document
      .getElementById('name-select')
      .addEventListener(
        'change',
        loadData
      );


    async function init() {

      try {

        await loadShops();

        await loadFromUrl();

      } catch (error) {

        console.error(error);

        document
          .getElementById(
            'result-info'
          )
          .textContent =
            'データ取得に失敗しました。';
      }
    }


    init();

  </script>

</body>
</html>
