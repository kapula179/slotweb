<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Slot Data</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 12px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 16px;
    }

    .filters {
      background: white;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
    }

    .filter-row {
      margin-bottom: 10px;
    }

    .filter-row:last-child {
      margin-bottom: 0;
    }

    label {
      display: inline-block;
      width: 50px;
      font-weight: bold;
    }

    select {
      font-size: 16px;
      padding: 7px;
      width: calc(100% - 60px);
      max-width: 350px;
    }

    .result-info {
      margin: 10px 0;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 14px;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 7px 3px;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: #eee;
    }

    .positive {
      color: red;
    }

    .negative {
      color: blue;
    }

    @media (max-width: 600px) {
      body {
        margin: 8px;
      }

      h1 {
        font-size: 20px;
      }

      table {
        font-size: 12px;
      }

      th,
      td {
        padding: 6px 2px;
      }
    }
  </style>
</head>

<body>

  <h1>スロットデータ</h1>

  <div class="filters">

    <div class="filter-row">
      <label for="shop-select">店舗</label>
      <select id="shop-select">
        <option value="">全店舗</option>
      </select>
    </div>

    <div class="filter-row">
      <label for="day-select">日付</label>
      <select id="day-select">
        <option value="">全日付</option>
      </select>
    </div>

    <div class="filter-row">
      <label for="name-select">機種</label>
      <select id="name-select">
        <option value="">全機種</option>
      </select>
    </div>

  </div>

  <div id="result-info" class="result-info"></div>

  <table>
    <thead>
      <tr>
        <th>台番</th>
        <th>BIG</th>
        <th>REG</th>
        <th>回転</th>
        <th>差枚</th>
        <th>RANK</th>
      </tr>
    </thead>

    <tbody id="slot-data"></tbody>
  </table>


  <script>
    const SUPABASE_URL =
      'https://cbakwimqxhfbqdnvyeoi.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_CIVy_I-SIKBrfNfXa1sGYQ_b3sMvKMm';


    let allData = [];


    async function fetchAllData() {

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/slot?select=*&order=day.desc,slotid`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      if (!response.ok) {
        document.getElementById('result-info').textContent =
          'データ取得に失敗しました。';

        return;
      }

      allData = await response.json();
    }


    function uniqueValues(column) {

      return [
        ...new Set(
          allData
            .map(row => row[column])
            .filter(value => value !== null && value !== '')
        )
      ];
    }


    function setOptions(selectId, values, allLabel) {

      const select =
        document.getElementById(selectId);

      const currentValue =
        select.value;

      select.innerHTML =
        `<option value="">${allLabel}</option>`;

      values.forEach(value => {

        const option =
          document.createElement('option');

        option.value = value;
        option.textContent = value;

        select.appendChild(option);
      });

      if (values.includes(currentValue)) {
        select.value = currentValue;
      }
    }


    function updateFilters() {

      const shop =
        document.getElementById('shop-select').value;

      const day =
        document.getElementById('day-select').value;

      const name =
        document.getElementById('name-select').value;


      // 店舗候補
      setOptions(
        'shop-select',
        uniqueValues('shopid').sort(),
        '全店舗'
      );


      // 選択店舗に存在する日付だけ
      const daySource =
        allData.filter(row =>
          !shop || row.shopid === shop
        );

      const days = [
        ...new Set(
          daySource.map(row => row.day)
        )
      ].sort().reverse();

      setOptions(
        'day-select',
        days,
        '全日付'
      );


      // 店舗・日付に存在する機種だけ
      const nameSource =
        allData.filter(row =>
          (!shop || row.shopid === shop) &&
          (!day || row.day === day)
        );

      const names = [
        ...new Set(
          nameSource
            .map(row => row.name)
            .filter(Boolean)
        )
      ].sort();

      setOptions(
        'name-select',
        names,
        '全機種'
      );
    }


    function displayData() {

      const shop =
        document.getElementById('shop-select').value;

      const day =
        document.getElementById('day-select').value;

      const name =
        document.getElementById('name-select').value;


      const filteredData =
        allData.filter(row => {

          return (
            (!shop || row.shopid === shop) &&
            (!day || row.day === day) &&
            (!name || row.name === name)
          );

        });


      const tbody =
        document.getElementById('slot-data');

      tbody.innerHTML = '';


      filteredData.forEach(row => {

        let medalClass = '';

        if (row.medal > 0) {
          medalClass = 'positive';
        } else if (row.medal < 0) {
          medalClass = 'negative';
        }


        tbody.innerHTML += `
          <tr>
            <td>${row.slotid ?? ''}</td>
            <td>${row.big ?? ''}</td>
            <td>${row.reg ?? ''}</td>
            <td>${row.count ?? ''}</td>
            <td class="${medalClass}">
              ${row.medal ?? ''}
            </td>
            <td>${row.rank ?? ''}</td>
          </tr>
        `;
      });


      let info = `${filteredData.length}台`;

      if (shop) {
        info += ` / ${shop}`;
      }

      if (day) {
        info += ` / ${day}`;
      }

      if (name) {
        info += ` / ${name}`;
      }

      document.getElementById('result-info').textContent =
        info;
    }


    function updateUrl() {

      const shop =
        document.getElementById('shop-select').value;

      const day =
        document.getElementById('day-select').value;

      const name =
        document.getElementById('name-select').value;


      const params =
        new URLSearchParams();

      if (shop) {
        params.set('shop', shop);
      }

      if (day) {
        params.set('day', day);
      }

      if (name) {
        params.set('name', name);
      }


      const query =
        params.toString();

      const url =
        query
          ? `${location.pathname}?${query}`
          : location.pathname;

      history.replaceState(
        null,
        '',
        url
      );
    }


    function refresh() {

      updateFilters();
      displayData();
      updateUrl();
    }


    function loadUrlParameters() {

      const params =
        new URLSearchParams(location.search);

      const shop =
        params.get('shop');

      const day =
        params.get('day');

      const name =
        params.get('name');


      if (shop) {
        document.getElementById('shop-select').value =
          shop;
      }

      updateFilters();


      if (day) {
        document.getElementById('day-select').value =
          day;
      }

      updateFilters();


      if (name) {
        document.getElementById('name-select').value =
          name;
      }
    }


    document
      .getElementById('shop-select')
      .addEventListener('change', () => {

        document.getElementById('day-select').value = '';
        document.getElementById('name-select').value = '';

        refresh();
      });


    document
      .getElementById('day-select')
      .addEventListener('change', () => {

        document.getElementById('name-select').value = '';

        refresh();
      });


    document
      .getElementById('name-select')
      .addEventListener('change', refresh);


    async function init() {

      await fetchAllData();

      updateFilters();

      loadUrlParameters();

      displayData();

      updateUrl();
    }


    init();

  </script>

</body>
</html>
