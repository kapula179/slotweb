<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Slot Data</title>
</head>
<body>
  <h1>スロットデータ</h1>

  <table border="1">
    <thead>
      <tr>
        <th>店舗</th>
        <th>台番</th>
        <th>BIG</th>
        <th>REG</th>
        <th>回転数</th>
        <th>日付</th>
        <th>機種</th>
        <th>差枚</th>
        <th>RANK</th>
      </tr>
    </thead>
    <tbody id="slot-data"></tbody>
  </table>

  <script>
    const SUPABASE_URL = 'https://cbakwimqxhfbqdnvyeoi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_CIVy_I-SIKBrfNfXa1sGYQ_b3sMvKMm';

    async function loadData() {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/slot?select=*`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      const data = await response.json();

      const tbody = document.getElementById('slot-data');

      data.forEach(row => {
        tbody.innerHTML += `
          <tr>
            <td>${row.shopid}</td>
            <td>${row.slotid}</td>
            <td>${row.big}</td>
            <td>${row.reg}</td>
            <td>${row.count}</td>
            <td>${row.day}</td>
            <td>${row.name}</td>
            <td>${row.medal}</td>
            <td>${row.rank}</td>
          </tr>
        `;
      });
    }

    loadData();
  </script>
</body>
</html>
